kind = "web"
previewPath = "/"
title = "Project Margo C4 Architecture Diagrams"
version = "1.0.0"
id = "artifacts/margo-c4"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19523

[services.development]
run = "pnpm --filter @workspace/margo-c4 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/margo-c4", "run", "build" ]
publicDir = "artifacts/margo-c4/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19523"
BASE_PATH = "/"
